services:
  postgres:
    image: postgres:16
    container_name: bodeganube-db
    environment:
      POSTGRES_USER: bodega
      POSTGRES_PASSWORD: bodega
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - bodeganube-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

volumes:
  bodeganube-data:

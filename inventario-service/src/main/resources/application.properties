spring.application.name=inventario-service
server.port=8082

# --- Base de datos relacional (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario_db}
spring.datasource.username=${DB_USER:bodega}
spring.datasource.password=${DB_PASSWORD:bodega}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Seguridad (secretos de desarrollo; sobrescribir con variables de entorno) ---
app.jwt.secret=${JWT_SECRET:bodeganube-clave-secreta-de-desarrollo-minimo-32-bytes}
app.internal-key=${INTERNAL_KEY:bodeganube-internal-dev}

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
